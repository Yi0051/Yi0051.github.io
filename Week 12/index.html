<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gravity maze</title>
  <style>
    canvas {
      border: 2px solid black;
      background: #fafafa;
      display: block;
      margin: 20px auto;
    }
    body {
      font-family: sans-serif;
      text-align: center;
    }
    #message {
      font-weight: bold;
      font-size: 18px;
      color: green;
      margin-top: 10px;
    }
    button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Gravity maze</h1>
  <input type="range" min="-360" max="360" value="0" id="rotationSlider" />
  <p><span id="rotationValue">0°</span></p>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <p id="message"></p>
  <button id="resetBtn">Reset</button>
  <button id="nextLevelBtn" style="display: none;">Next</button>
  <script src="script.js"></script>
</body>
</html>
